services:
  - type: web
    name: crackncode-school
    runtime: php
    plan: free
    region: singapore
    buildCommand: bash render-build.sh
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: CrackNCode
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:0F6C19E0r/irAPMk8csITmG5IsOG+9fK88sQYSTOsfw=
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr
